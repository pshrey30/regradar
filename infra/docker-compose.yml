services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: regradar
      POSTGRES_PASSWORD: regradar
      POSTGRES_DB: regradar
    ports:
      - "5432:5432"
    volumes:
      - regradar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # `image:` + `build:` together on api/worker (migrate reuses the api
  # image): a new developer can `docker compose pull` to grab the images
  # already published by .github/workflows/docker-publish.yml from GHCR —
  # no local build, no Python toolchain needed — then `docker compose up`.
  # Anyone actively changing app code still gets the old
  # `docker compose up --build` behavior unchanged.
  migrate:
    image: ghcr.io/pshrey30/regradar-api:latest
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://regradar:regradar@postgres:5432/regradar
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/pshrey30/regradar-api:latest
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://regradar:regradar@postgres:5432/regradar
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    image: ghcr.io/pshrey30/regradar-worker:latest
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://regradar:regradar@postgres:5432/regradar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  regradar_postgres_data:
