[project]
name = "regradar"
version = "0.1.0"
description = "Multi-agent regulatory intelligence system monitoring SEC, FDA, and FINRA filings."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "celery>=5.4",
    "redis>=5.0",
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "llama-index>=0.10",
    "llama-index-retrievers-bm25>=0.3",
    "llama-index-llms-ollama>=0.5",
    "openai>=1.35",
    "httpx>=0.27",
    "boto3>=1.34",
    "feedparser>=6.0",
    "prefect>=2.19",
    "tiktoken>=0.7",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
api = [
    "slowapi>=0.1.9",
]
worker = [
    "prefect>=2.19",
]
eval = [
    # EVAL-01: the `regradar run-eval` CLI subcommand's runtime dependency,
    # not a dev/test-only tool — split out of `dev` so a production install
    # that actually runs the eval harness pulls it in explicitly.
    "ragas>=0.4,<0.5",
    # ragas>=0.4's own `langchain-community` requirement is unpinned, which
    # resolves to a version whose `langchain_community.chat_models` no
    # longer has the `vertexai` submodule ragas imports eagerly at import
    # time (ImportError even when Vertex AI is never used) — pin to the
    # last version confirmed compatible.
    "langchain-community>=0.3.20,<0.4",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "moto>=5.0",
    "evaluate>=0.4",
]

[project.scripts]
regradar = "regradar.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends(...)/Query(...)/Header(...) in argument defaults is the
# idiomatic dependency-injection pattern, not the mutable-default-argument
# bug B008 exists to catch — every authenticated route (starting with
# GET /v1/_whoami in API-02) uses Depends(get_current_key) this way.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.mypy]
python_version = "3.11"
packages = ["regradar"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits a real external API — excluded by default, run explicitly with `pytest -m live`",
]
addopts = "-m 'not live'"
