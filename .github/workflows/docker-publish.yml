name: Publish Docker images

"on":
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # Dockerfile.prefect is still a placeholder (FOUND-03), not a real
        # image yet — excluded until that's built.
        service: [api, worker]
    steps:
      - uses: actions/checkout@v4

      # The default `docker` builder doesn't support the GitHub Actions
      # cache backend (cache-from/cache-to: type=gha below) — that needs
      # Buildx's docker-container driver, which this step provisions.
      # Without it, build-push-action fails outright rather than silently
      # skipping the cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
